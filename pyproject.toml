[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
# Start with correctness/import hygiene; expand gradually.
select = ["E9", "F63", "F7", "F82"]
ignore = []
